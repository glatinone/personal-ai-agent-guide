<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="#1a1a2e">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 24px; font-weight: bold; fill: #e0e0e0; }
      .label { font-size: 16px; font-weight: 600; fill: #ffffff; }
      .sublabel { font-size: 12px; fill: #b0b0b0; }
      .arrow { stroke: #4a9eff; stroke-width: 3; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a9eff"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#0f0f1a" rx="10"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" class="title">Arsitektur Personal AI Agent</text>
  
  <!-- User Box -->
  <rect x="50" y="80" width="120" height="80" fill="#16213e" stroke="#4a9eff" stroke-width="2" rx="8"/>
  <text x="110" y="115" text-anchor="middle" class="label">👤 User</text>
  <text x="110" y="140" text-anchor="middle" class="sublabel">Telegram/Discord/CLI</text>
  
  <!-- Arrow User -> Hermes -->
  <line x1="170" y1="120" x2="280" y2="120" class="arrow"/>
  
  <!-- Hermes Box -->
  <rect x="280" y="80" width="140" height="100" fill="#1a3a5c" stroke="#00d4ff" stroke-width="2" rx="8"/>
  <text x="350" y="115" text-anchor="middle" class="label">🤖 Hermes Agent</text>
  <text x="350" y="140" text-anchor="middle" class="sublabel">Brain &amp; Orchestrator</text>
  <text x="350" y="160" text-anchor="middle" class="sublabel">Skills + Memory</text>
  
  <!-- Arrow Hermes -> Paperclip -->
  <line x1="420" y1="130" x2="530" y2="130" class="arrow"/>
  
  <!-- Paperclip Box -->
  <rect x="530" y="80" width="140" height="120" fill="#2d1b4e" stroke="#9b59b6" stroke-width="2" rx="8"/>
  <text x="600" y="110" text-anchor="middle" class="label">📎 Paperclip</text>
  <text x="600" y="135" text-anchor="middle" class="sublabel">CEO Agent</text>
  <text x="600" y="155" text-anchor="middle" class="sublabel">Manager Agent</text>
  <text x="600" y="175" text-anchor="middle" class="sublabel">Task Queue</text>
  
  <!-- Arrow Paperclip -> Workers -->
  <line x1="600" y1="200" x2="600" y2="250" class="arrow"/>
  
  <!-- Workers Box -->
  <rect x="450" y="250" width="300" height="100" fill="#1b3a2d" stroke="#2ecc71" stroke-width="2" rx="8"/>
  <text x="600" y="280" text-anchor="middle" class="label">⚙️ Worker Agents</text>
  <text x="600" y="305" text-anchor="middle" class="sublabel">Research • Coding • Writing • Analysis</text>
  
  <!-- Return Arrow -->
  <path d="M 450 300 Q 200 300 200 180 Q 200 120 170 120" fill="none" stroke="#2ecc71" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="180" y="250" class="sublabel" fill="#2ecc71">Results</text>
  
  <!-- Legend -->
  <rect x="50" y="320" width="200" height="60" fill="#16213e" stroke="#4a9eff" stroke-width="1" rx="5"/>
  <text x="60" y="345" class="sublabel" fill="#4a9eff">→ Command Flow</text>
  <text x="60" y="365" class="sublabel" fill="#2ecc71">- - → Result Return</text>
</svg>